[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-data-training-manager"
version = "0.1.0"
description = "CLI platform for dataset processing, experiments, training, evaluation, and automation."
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
