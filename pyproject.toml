[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-data-training-manager"
version = "0.2.0"
description = "CLI platform for dataset validation, preprocessing, training, evaluation, and automation."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
ai-pipeline = "ai_pipeline.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
